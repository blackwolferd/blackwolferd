name: Generate Snake Contribution Grid

on:
  schedule:
    # Runs automatically every 12 hours (00:00 & 12:00 UTC)
    - cron: "0 */12 * * *"
  
  # Allows 1-click manual trigger from the GitHub Actions tab
  workflow_dispatch:
  
  # Runs whenever you push new commits to main
  push:
    branches:
      - main

# Explicit write permissions so GITHUB_TOKEN can push to the output branch
permissions:
  contents: write

# Cancel any in-progress runs if a new commit is pushed rapidly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate Contribution Snake Animation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Generate Light SVG, Dark SVG, and Animated GIF
      - name: Generate Snake Files
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Deploy output SVGs & GIFs to an isolated 'output' branch
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
